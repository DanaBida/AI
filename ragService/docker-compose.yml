services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-property-service
    env_file:
      - .env
    environment:
      CHROMA_DB_PATH: /app/artifacts/chroma_db
    ports:
      - '8001:8001'
    volumes:
      - chroma_data:/app/artifacts/chroma_db
      - model_data:/app/artifacts/models
    restart: on-failure
    networks:
      - rag-network
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
  model_data:
    driver: local
